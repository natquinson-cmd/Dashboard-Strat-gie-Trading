<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="lg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>

  <!-- Grid lines (subtle) -->
  <g clip-path="url(#clip)" opacity="0.12" stroke="#8899aa" stroke-width="0.5">
    <line x1="0" y1="10" x2="32" y2="10"/>
    <line x1="0" y1="20" x2="32" y2="20"/>
  </g>

  <!-- Fill area under curve -->
  <polygon points="3,27 7,22 11,24 16,14 20,17 27,8 27,27" fill="url(#fill)" clip-path="url(#clip)"/>

  <!-- Main line -->
  <polyline
    points="3,27 7,22 11,24 16,14 20,17 27,8"
    fill="none"
    stroke="url(#lg)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    clip-path="url(#clip)"/>

  <!-- Peak dot (glowing green) -->
  <circle cx="27" cy="8" r="2.8" fill="#10b981"/>
  <circle cx="27" cy="8" r="1.5" fill="#fff" opacity="0.8"/>
</svg>
